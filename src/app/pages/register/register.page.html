<div class="flex justify-center p-2" style="background-color: var(--background);">
    <div class="relative w-full max-w-md mt-12 mb-12">
        <div
            class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 backdrop-blur-xl border border-black/30 p-4 md:p-6">
            <div class="text-center pt-1 mb-4">
                <p class="text-base font-semibold text-black">Register</p>
            </div>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
                <div class="group">
                    <label for="firstName" class="block text-sm font-semibold text-slate-700 mb-2">First Name</label>
                    <input type="text" id="firstName" formControlName="firstName" placeholder="First Name"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm" />
                </div>
                <div class="group">
                    <label for="lastName" class="block text-sm font-semibold text-slate-700 mb-2">Last Name</label>
                    <input type="text" id="lastName" formControlName="lastName" placeholder="Last Name"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm" />
                </div>
                <div class="group">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                    <input type="email" id="email" formControlName="email" placeholder="you@example.com"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm" />
                </div>
                <div class="group">
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <input type="password" id="password" formControlName="password" placeholder="••••••••"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm" />
                </div>
                <div class="group">
                    <label for="confirmPassword" class="block text-sm font-semibold text-slate-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm" />
                </div>
                <button type="submit"
                    class="w-full px-4 py-2 rounded-lg font-semibold text-white flex items-center justify-center gap-2 hover:opacity-90 transition-opacity text-sm"
                    style="background-color: var(--primary);">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>
