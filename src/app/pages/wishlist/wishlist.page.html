<main class="mx-auto w-9/12 px-4 py-10 md:px-6 md:py-12" aria-labelledby="wishlist-title">
    <section class="mb-8 space-y-2 md:mb-10">
        <p class="wishlist-eyebrow text-xs font-bold uppercase tracking-[0.14em]">Saved For Later</p>
        <h1 id="wishlist-title" class="text-3xl font-bold tracking-tight md:text-4xl">My favorites</h1>
        <p class="wishlist-subtitle max-w-2xl text-sm md:text-base">
            {{ subtitle() }}
        </p>
    </section>

    @if (wishlistItems().length === 0) {
        <section class="wishlist-empty rounded-xl border p-8 text-center">
            <h2 class="text-xl font-semibold">Your wishlist is empty</h2>
            <p class="wishlist-empty-copy mt-2 text-sm">
                Tap the heart icon on any product card to save it here.
            </p>
        </section>
    } @else {
        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" aria-label="Wishlist products">
            @for (item of wishlistItems(); track item.id) {
                <app-product-card
                    [id]="item.id"
                    [brand]="item.brand"
                    [category]="item.category"
                    [title]="item.title"
                    [price]="item.price"
                    [image]="item.image"
                    [tags]="[]"
                ></app-product-card>
            }
        </section>
    }
</main>
