<div class="flex justify-center bg-background p-2">

    <!-- Main form -->
    <div class="relative w-full max-w-md mt-12 mb-12">
        <div
            class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 backdrop-blur-xl border border-black/30 p-4 md:p-6">

            <!-- Header -->
            <div class="text-center pt-1 mb-4">
                <p class="text-base font-semibold text-black">Sign in</p>
            </div>

            <!-- Error message -->
            <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg animate-shake">
                <p class="text-red-700 text-sm font-medium">{{ error }}</p>
            </div>

            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
                <!-- Email field -->
                <div class="group">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                        Email
                    </label>
                    <input type="email" id="email" formControlName="email" placeholder="you@example.com"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm"
                        [class.border-red-300]="submitted && email?.invalid"
                        [class.focus:ring-red-500]="submitted && email?.invalid" />
                    <p *ngIf="submitted && email?.invalid && email?.errors?.['required']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Email is required
                    </p>
                    <p *ngIf="submitted && email?.invalid && email?.errors?.['email']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Please enter a valid email
                    </p>
                </div>
                <!-- Password field -->
                <div class="group">
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                        Password
                    </label>
                    <input type="password" id="password" formControlName="password" placeholder="••••••••"
                        class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-slate-50/50 text-slate-900 placeholder-slate-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 focus:bg-white hover:border-gray-400 text-sm"
                        [class.border-red-300]="submitted && password?.invalid"
                        [class.focus:ring-red-500]="submitted && password?.invalid" />
                    <p *ngIf="submitted && password?.invalid && password?.errors?.['required']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Password is required
                    </p>
                    <p *ngIf="submitted && password?.invalid && password?.errors?.['minlength']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Password must be at least 6 characters
                    </p>
                </div>
                <button type="submit"
                    class="bg-primary text-primary-foreground flex w-full items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition-opacity hover:opacity-90">
                    Sign in
                </button>
            </form>
            <div class="mt-8 text-center space-y-4">
                <p class="text-sm text-gray-700">
                    Don't have an account?
                    <a href="/register"
                        class="text-sm font-bold text-black transition-colors hover:underline hover:decoration-2 hover:decoration-black">Sign
                        up</a>
                </p>
            </div>
