<div class="flex justify-center bg-background p-2">
    <!-- Main form -->
    <div class="relative w-full max-w-sm mt-10 mb-10">
        <div
            class="bg-white rounded-xl shadow-xl shadow-slate-200/50 backdrop-blur-xl border border-gray-300 p-3 md:p-4">

            <!-- Header -->
            <div class="text-center pt-1 mb-4">
                <h1 class="h1-login-register">Sign in</h1>
            </div>

            <!-- Error message -->
            <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg animate-shake">
                <p class="text-red-700 text-sm font-medium">{{ error }}</p>
            </div>

            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
                <!-- Email field -->
                <div class="group">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">
                        Email
                    </label>
                    <input type="email" id="email" formControlName="email" placeholder="you@example.com"
                        class="form-field-control form-field-control--sm bg-slate-50/50 text-slate-900 placeholder-slate-400 hover:border-gray-400"
                        [class.border-red-300]="submitted && email?.invalid"
                        [class.focus:ring-red-500]="submitted && email?.invalid" />
                    <p *ngIf="submitted && email?.invalid && email?.errors?.['required']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Email is required
                    </p>
                    <p *ngIf="submitted && email?.invalid && email?.errors?.['email']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Please enter a valid email
                    </p>
                </div>
                <!-- Password field -->
                <div class="group">
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">
                        Password
                    </label>
                    <input type="password" id="password" formControlName="password" placeholder="••••••••"
                        class="form-field-control form-field-control--sm bg-slate-50/50 text-slate-900 placeholder-slate-400 hover:border-gray-400"
                        [class.border-red-300]="submitted && password?.invalid"
                        [class.focus:ring-red-500]="submitted && password?.invalid" />
                    <p *ngIf="submitted && password?.invalid && password?.errors?.['required']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Password is required
                    </p>
                    <p *ngIf="submitted && password?.invalid && password?.errors?.['minlength']"
                        class="mt-2 text-xs text-red-600 font-medium">
                        Password must be at least 6 characters
                    </p>
                </div>
                <button type="submit"
                    class="form-button--sm bg-primary text-primary-foreground flex w-full items-center justify-center gap-2 rounded-lg font-semibold transition-opacity hover:opacity-90">
                    Sign in
                </button>
            </form>
            <div class="mt-6 flex items-center justify-center gap-2 text-center">
                <span class="text-sm text-foreground">Don't have an account?</span>
                <h2 class="h2-login-register" style="margin-bottom: 0;">
                    <a href="/register" class="h2-login-register">Sign up</a>
                </h2>
            </div>
