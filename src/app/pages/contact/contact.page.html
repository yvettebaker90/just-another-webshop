@if (showSuccessToast) {
  <div class="fixed top-8 left-1/2 z-50 -translate-x-1/2 rounded-md bg-green-600 px-6 py-3 text-white shadow-lg transition-opacity duration-300">
    Your message has been sent!
  </div>
}

<div class="contact-page content-shell py-8 space-y-10">
  <div class="max-w-xl mx-auto">
    <section class="mb-12 space-y-2">
      <h1 class="sr-only">Contact Us</h1>
      <h2 class="font-heading mt-10 text-left text-3xl font-bold text-foreground sm:mt-20">
        Get in Touch
      </h2>
      <p class="max-w-2xl text-sm text-foreground md:text-base">
        We'd love to hear from you. Send us a message and we'll respond as soon as possible.
      </p>
    </section>

    <!-- Contact Form -->
    <form (submit)="sendEmail($event)" class="form-surface contact-page__form space-y-5 rounded-xl p-6 md:p-5">
      
      <!-- Name Input -->
      <div>
        <label for="user_name" class="form-field-label">Your Name</label>
        <input
          id="user_name"
          type="text"
          name="user_name"
          placeholder="Enter your full name"
          required
          class="form-field-control form-field-control--sm"
        />
      </div>

      <!-- Email Input -->
      <div>
        <label for="user_email" class="form-field-label">Your Email</label>
        <input
          id="user_email"
          type="email"
          name="user_email"
          placeholder="Enter your email address"
          required
          class="form-field-control form-field-control--sm"
        />
      </div>

      <!-- Message Textarea -->
      <div>
        <label for="message" class="form-field-label">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Tell us what's on your mind..."
          rows="6"
          required
          class="form-field-control form-field-control--sm form-field-control--textarea"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isSending"
        class="form-button--sm flex items-center justify-center w-full cursor-pointer bg-black text-white font-medium rounded-lg hover:bg-black/90 disabled:cursor-not-allowed disabled:opacity-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2"
      > <ng-icon name="ionMailOutline" size="24" class="inline-block mr-2"></ng-icon>
        {{ isSending ? 'Sending...' : 'Send Message' }}
      </button>

    </form>
  </div>
</div>
