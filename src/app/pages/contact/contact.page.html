@if (showSuccessToast) {
  <div class="fixed top-8 left-1/2 z-50 -translate-x-1/2 rounded bg-green-600 px-6 py-3 text-white shadow-lg transition-opacity duration-300">
    Your message has been sent!
  </div>
}

<div class="w-full px-6 py-16 mx-0 lg:w-9/12 lg:mx-auto lg:px-4">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="mb-12 text-left">
      <h1 class="text-4xl font-bold text-foreground mb-3">Get in Touch</h1>
      <p class="text-muted-foreground text-lg">We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
    </div>

    <!-- Contact Form -->
    <form (submit)="sendEmail($event)" class="bg-card rounded-lg shadow-md p-8 border border-border">
      
      <!-- Name Input -->
      <div class="mb-6">
        <label for="user_name" class="block text-sm font-medium text-foreground mb-2">Your Name</label>
        <input
          id="user_name"
          type="text"
          name="user_name"
          placeholder="Enter your full name"
          required
          class="w-full px-4 py-3 border border-input rounded-lg focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent bg-background text-foreground placeholder-muted-foreground transition-all"
        />
      </div>

      <!-- Email Input -->
      <div class="mb-6">
        <label for="user_email" class="block text-sm font-medium text-foreground mb-2">Your Email</label>
        <input
          id="user_email"
          type="email"
          name="user_email"
          placeholder="Enter your email address"
          required
          class="w-full px-4 py-3 border border-input rounded-lg focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent bg-background text-foreground placeholder-muted-foreground transition-all"
        />
      </div>

      <!-- Message Textarea -->
      <div class="mb-8">
        <label for="message" class="block text-sm font-medium text-foreground mb-2">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Tell us what's on your mind..."
          rows="6"
          required
          class="w-full px-4 py-3 border border-input rounded-lg focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent bg-background text-foreground placeholder-muted-foreground transition-all resize-none"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isSending"
        class="w-full cursor-pointer px-6 py-3 bg-black text-white font-medium rounded-lg hover:bg-black/90 disabled:cursor-not-allowed disabled:opacity-50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2"
      >
        {{ isSending ? 'Sending...' : 'Send Message' }}
      </button>

    </form>
  </div>
</div>
