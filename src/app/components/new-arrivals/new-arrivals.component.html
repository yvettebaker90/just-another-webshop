<section class="py-12 md:py-16 bg-muted/20">
    <div class="w-9/12 mx-auto px-4">
        <div class="mb-6">
            <h2 class="mb-1 text-3xl font-light tracking-tight">New Arrivals</h2>
            <p class="mt-2 text-sm text-foreground font-light">Discover our latest collection</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <app-product-card *ngFor="let product of newArrivals()" [id]="product.id" [brand]="product.brand"
                [category]="product.category" [title]="product.title" [price]="product.price"
                [image]="product.image || product.image_1 || ''" [tags]="product.tags || []">
            </app-product-card>
        </div>
        <div class="mt-12 text-center">
            <button routerLink="/products" fragment="top" class="btn btn-outline btn-lg font-light tracking-wide">View
                All Products</button>
        </div>
    </div>
</section>
