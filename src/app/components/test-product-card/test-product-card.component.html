<div
    class="mx-auto mt-8 grid w-9/12 grid-cols-1 justify-center sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
    @for (product of products; track product.id) {
    <app-test-product-card [brand]="product.brand" [category]="product.category || 'Unknown Category'"
        [title]="product.title" [price]="product.price" [image]="product.image || product.image_1 || ''">
    </app-test-product-card>
    }

    @if (products.length === 0) {
    <p class="col-span-full rounded border border-gray-200 bg-white px-4 py-6 text-center text-sm text-gray-600">
        No products found.
    </p>
    }
</div>
