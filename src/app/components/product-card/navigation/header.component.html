<header class="w-full bg-[#f8f7f5] border-b border-[#d4cfc7] sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <!-- Logo/Brand -->
      <div class="shrink-0">
        <a routerLink="/home" class="focus:outline-none">
          <span class="text-2xl text-[#2b2b2b] header-logo tracking-tight">
            JUST ANOTHER WEBSHOP
          </span>
        </a>
      </div>

      <!-- Navigation Menu -->
      <nav class="hidden md:flex items-center space-x-12">
        <a 
          routerLink="/home" 
          routerLinkActive="border-b-2 border-[#a3b18a]"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-[#2b2b2b] text-sm font-medium pb-1 transition-all duration-200 relative nav-link"
        >
          Home
        </a>
        <a 
          routerLink="/products" 
          routerLinkActive="border-b-2 border-[#a3b18a]"
          class="text-[#2b2b2b] text-sm font-medium pb-1 transition-all duration-200 relative nav-link"
        >
          Collections
        </a>
      </nav>

      <!-- Right Icons -->
      <div class="flex items-center space-x-6">
        <!-- Wishlist Icon -->
        <button aria-label="Wishlist">
          <ng-icon name="ionHeartOutline" size="24" color="black"></ng-icon>
        </button>
        <!-- Shopping Cart Icon with badge -->
        <div class="relative">
          <a routerLink="/shopping-cart" aria-label="Shopping cart">
            <ng-icon name="ionCartOutline" size="24" color="black"></ng-icon>
          </a>
          <span
            *ngIf="cartCount > 0"
            class="absolute -top-2 -right-2 bg-black text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white"
          >
            {{ cartCount }}
          </span>
        </div>
        <!-- User Account Icon -->
        <button aria-label="Account">
          <ng-icon name="ionPersonOutline" size="24" color="black"></ng-icon>
        </button>
      </div>
    </div>
  </div>
</header>
