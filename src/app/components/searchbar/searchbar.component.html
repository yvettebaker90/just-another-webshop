<div class="w-full max-w-3xl mx-auto px-4 mt-4 mb-4">
  <div class="relative flex items-center">
    <ng-icon
      name="ionSearchOutline"
      class="absolute left-3 w-5 h-5 text-gray-400"
    ></ng-icon>
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      placeholder="Search products..."
      class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded text-gray-900 placeholder-gray-500 focus:outline-none focus:border-[#a3b18a] focus:ring-1 focus:ring-[#a3b18a] transition-colors"
    />
  </div>
</div>
