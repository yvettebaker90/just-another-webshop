<aside class="space-y-4">
  <section class="rounded-md border border-black/15 bg-white p-5 space-y-4">
    <h2 class="mb-4 text-xl font-semibold">Categories</h2>
    <div class="flex flex-col gap-3 text-[17px]">
      @for (category of categories(); track category) {
        <label class="inline-flex items-center gap-2 text-black/85">
          <input
            type="checkbox"
            class="h-4 w-4 rounded border-black/25 text-black focus:ring-black/30"
            [checked]="isCategorySelected(category)"
            (change)="onCategoryClick(category)"
          />
          <span>{{ formatCategoryLabel(category) }}</span>
        </label>
      }
    </div>
  </section>

  <section class="rounded-md border border-black/15 bg-white p-5 space-y-4">
    <h2 class="mb-4 text-xl font-semibold">Brands</h2>
    <div class="flex flex-col gap-3 text-[17px]">
      @for (brand of brands(); track brand) {
        <label class="inline-flex items-center gap-2 text-black/85">
          <input
            type="checkbox"
            class="h-4 w-4 rounded border-black/25 text-black focus:ring-black/30"
            [checked]="isBrandSelected(brand)"
            (change)="onBrandClick(brand)"
          />
          <span>{{ formatCategoryLabel(brand) }}</span>
        </label>
      }
    </div>
  </section>

  <section class="rounded-md border border-black/15 bg-white p-5 space-y-4">
    <h2 class="mb-4 text-xl font-semibold">Price Range</h2>
    <input
      type="range"
      class="w-full accent-black"
      min="0"
      [max]="highestPrice()"
      [value]="maxPrice()"
      aria-label="Maximum price"
      title="Maximum price"
      (input)="onMaxPriceChange($event)"
    />
    <div class="mt-3 flex items-center justify-between text-xl">
      <span>$0</span>
      <span>${{ highestPrice() }}</span>
    </div>
  </section>

  <section class="rounded-md border border-black/15 bg-white p-5 space-y-4">
    <h2 class="mb-4 text-xl font-semibold">Tags</h2>
    <div class="flex flex-col gap-3 text-[17px]">
      @for (tag of availableTags(); track tag) {
        <label class="inline-flex items-center gap-2 text-black/85">
          <input
            type="checkbox"
            class="h-4 w-4 rounded border-black/25 text-black focus:ring-black/30"
            [checked]="isTagSelected(tag.toLowerCase())"
            (change)="onTagToggle(tag.toLowerCase())"
          />
          <span>{{ tag }}</span>
        </label>
      }
    </div>
  </section>
</aside>
